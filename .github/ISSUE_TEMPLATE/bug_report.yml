name: Bug Report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as you can.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system is affected?
      options:
        - "— select area —"
        - Admin
        - API / Backend
        - Auth / JWT
        - Database / migrations
        - Deliverables
        - Frontend / UI
        - Kanban board
        - Marketplace
        - MCP server
        - Projects
        - Proposals
        - Rewards ledger
        - Submissions
        - Other
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Role
      description: Which user role were you acting as when the bug occurred?
      options:
        - "— select role —"
        - PM
        - Contributor
        - Admin
        - N/A
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Describe the unexpected behaviour.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Go version, Node version, DB driver (SQLite / MySQL), browser if relevant.
      placeholder: |
        Go: 1.25
        Node: 22
        DB: SQLite
        Browser: Chrome 124
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste server logs, browser console errors, or attach screenshots.
      render: shell
    validations:
      required: false
