name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Describe what you'd like to see and why it matters.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Projects
        - Deliverables
        - Proposals
        - Submissions
        - Rewards ledger
        - Kanban board
        - Marketplace
        - Admin
        - MCP server
        - Frontend / UI
        - API / Backend
        - Auth
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Who benefits and how?
      placeholder: As a PM, I can't do X which means I have to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, related issues, or anything else relevant.
    validations:
      required: false
